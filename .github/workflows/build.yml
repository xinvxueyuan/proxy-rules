name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "sources.json"
  schedule:
    - cron: "0 19 * * *" # 每天 03:00 CST
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不需要 Go 工具链：两个 .dat 由 scripts/build_xray_data.py 纯 Python 生成
      # （官方 dlc 的 tag 名校验不允许点，产不出 site.cn / advert.com 这类组名）。

      - name: 拉取上游并按生态分类
        run: python3 scripts/fetch_upstream.py

      - name: 合并三层数据并解析聚合组
        run: python3 scripts/assemble_data.py

      - name: 生成 Clash rule-provider
        run: python3 scripts/build_clash.py

      - name: 生成 Xray geosite.dat / geoip.dat
        run: python3 scripts/build_xray_data.py

      # GitHub Pages 站点源就是 dist 分支根，所以文档页与产物一起强推上去，
      # 订阅链接与文档同域同源（一个地址记一辈子）。
      - name: 生成 Pages 站点内容（文档页 + 示例片段）
        run: python3 scripts/build_docs.py

      - name: 用真实内核校验产物（含变异检验 + 一致性）
        run: bash scripts/verify.sh

      - name: 刷新全量 sha256 清单
        run: |
          cd "$GITHUB_WORKSPACE"
          find dist -type f ! -name MANIFEST.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > dist/MANIFEST.sha256
          cat dist/MANIFEST.sha256

      # 产物不进 main：main 每天被几 MB 的产物撑一次会把历史撑爆。
      # 改成往一个**孤立的 dist 分支**强推「只有一个快照提交」的分支 ——
      # 分支历史永远只有 1 个提交、不会累积，任何时刻拿到的都是最新一次构建。
      #
      # 这个分支同时是 GitHub Pages 的站点源（页面配置：dist 分支 / 根目录），
      # 所以它就是**唯一的订阅渠道**：不再发 Release、不在文档里给 raw 直链。
      - name: 发布产物到 dist 分支（单快照强推）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ART=/tmp/dist-artifacts
          rm -rf "$ART" && mkdir -p "$ART"
          cp -r dist/. "$ART/"
          find "$ART" \( -name '*.db' -o -name '*.log' \) -delete
          # Pages 靠这个文件关掉 Jekyll（否则会处理/过滤文件）
          test -f "$ART/.nojekyll" || touch "$ART/.nojekyll"
          cd "$ART"
          git init -q -b dist
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f origin HEAD:dist
          echo "已强推 dist 分支，文件："
          git ls-files | sed 's/^/  /'

