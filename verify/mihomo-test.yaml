# 仅用于 CI 校验：把 dist/clash/*.yaml 当作本地 rule-provider 加载一遍。
#
# 规则顺序即生产建议顺序：商业广告拦截 → 中文互联网追踪拦截 → 自持强制代理 →
# 国内直连 → 国内 IP 直连 → 兜底走代理。
# 注意这里**不写 GEOIP,CN**：那会让 mihomo 去下载 geoip.dat，
# 校验应当自洽、不依赖外部下载（真要用见 README 的客户端配置）。
mixed-port: 7899
log-level: warning
mode: rule
# 校验脚本靠这个 API 读 rule-provider 的真实条数
external-controller: 127.0.0.1:19090
secret: ci-verify-only

proxies:
  - name: dummy
    type: socks5
    server: 127.0.0.1
    port: 1080

proxy-groups:
  - name: PROXY
    type: select
    proxies: [dummy, DIRECT]

rule-providers:
  advert.com:
    type: file
    behavior: domain
    path: dist/clash/advert.com.yaml
  advert.cn:
    type: file
    behavior: domain
    path: dist/clash/advert.cn.yaml
  advert.gg:
    type: file
    behavior: domain
    path: dist/clash/advert.gg.yaml
  advert.ms:
    type: file
    behavior: domain
    path: dist/clash/advert.ms.yaml
  advert.fb:
    type: file
    behavior: domain
    path: dist/clash/advert.fb.yaml
  advert.x:
    type: file
    behavior: domain
    path: dist/clash/advert.x.yaml
  advert.tg:
    type: file
    behavior: domain
    path: dist/clash/advert.tg.yaml
  advert.org:
    type: file
    behavior: domain
    path: dist/clash/advert.org.yaml
  site.cn.gov:
    type: file
    behavior: domain
    path: dist/clash/site.cn.gov.yaml
  site.cn.media:
    type: file
    behavior: domain
    path: dist/clash/site.cn.media.yaml
  site.cn.edu:
    type: file
    behavior: domain
    path: dist/clash/site.cn.edu.yaml
  site.cn.med:
    type: file
    behavior: domain
    path: dist/clash/site.cn.med.yaml
  site.cn.fin:
    type: file
    behavior: domain
    path: dist/clash/site.cn.fin.yaml
  site.cn.life:
    type: file
    behavior: domain
    path: dist/clash/site.cn.life.yaml
  site.cn.map:
    type: file
    behavior: domain
    path: dist/clash/site.cn.map.yaml
  site.cn.travel:
    type: file
    behavior: domain
    path: dist/clash/site.cn.travel.yaml
  site.cn.shop:
    type: file
    behavior: domain
    path: dist/clash/site.cn.shop.yaml
  site.cn:
    type: file
    behavior: domain
    path: dist/clash/site.cn.yaml
  self-direct:
    type: file
    behavior: domain
    path: dist/clash/self-direct.yaml
  self-proxy:
    type: file
    behavior: domain
    path: dist/clash/self-proxy.yaml
  self-direct-ip:
    type: file
    behavior: ipcidr
    path: dist/clash/self-direct-ip.yaml

rules:
  - RULE-SET,advert.com,REJECT
  - RULE-SET,advert.cn,REJECT
  - RULE-SET,self-proxy,PROXY
  - RULE-SET,site.cn,DIRECT
  - RULE-SET,self-direct,DIRECT
  - RULE-SET,self-direct-ip,DIRECT,no-resolve
  - MATCH,PROXY
