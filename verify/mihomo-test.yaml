# 仅用于 CI 校验：把 dist/clash/*.yaml 当作本地 rule-provider 加载一遍。
#
# 规则顺序即生产建议顺序：拦截 → 代理覆盖 → 国内直连 → 兜底代理。
# 注意这里**不写 GEOIP,CN**：那会让 mihomo 去下载 geoip.dat，
# 校验应当自洽、不依赖外部下载（真要用见 README 的客户端配置）。
mixed-port: 7899
log-level: warning
mode: rule
# 校验脚本靠这个 API 读 rule-provider 的真实条数
external-controller: 127.0.0.1:19090
secret: ci-verify-only

proxies:
  - name: dummy
    type: socks5
    server: 127.0.0.1
    port: 1080

proxy-groups:
  - name: PROXY
    type: select
    proxies: [dummy, DIRECT]

rule-providers:
  self-direct:
    type: file
    behavior: domain
    path: dist/clash/self-direct.yaml
  self-proxy:
    type: file
    behavior: domain
    path: dist/clash/self-proxy.yaml
  self-reject:
    type: file
    behavior: domain
    path: dist/clash/self-reject.yaml
  self-direct-ip:
    type: file
    behavior: ipcidr
    path: dist/clash/self-direct-ip.yaml
  china-direct:
    type: file
    behavior: domain
    path: dist/clash/china-direct.yaml

rules:
  - RULE-SET,self-reject,REJECT
  - RULE-SET,self-proxy,PROXY
  - RULE-SET,china-direct,DIRECT
  - RULE-SET,self-direct,DIRECT
  - RULE-SET,self-direct-ip,DIRECT,no-resolve
  - MATCH,PROXY
